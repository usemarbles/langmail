# Zensical configuration
#
# Docs: https://zensical.org/docs/get-started/

[project]
site_name = "langmail"
docs_dir = "docs"
site_dir = "site"
site_url = "https://langmail.dev/"
site_description = "Email preprocessing for LLM consumption. Written in Rust, available for Node.js and Python."

extra_css = [
    "stylesheets/extra.css",
]

repo_url = "https://github.com/usemarbles/langmail"
edit_uri = "edit/main/docs"

copyright = "<a href=\"https://usemarbles.com/\">Marbles</a> · <a href=\"https://langmail.dev/llms.txt\">llms.txt</a>"

nav = [
    {"Home" = "index.md"},

    {"Getting Started" = [
        {"Introduction" = "introduction.md"},
        {"Installation" = "installation.md"},
        {"Quick Start" = "quickstart.md"},
    ]},

    {"Concepts" = "concepts.md"},

    {"API Reference" = [
        {"TypeScript / Node.js" = "api/typescript.md"},
        {"Python" = "api/python.md"},
        {"Rust" = "api/rust.md"},
    ]},
]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/favicon.svg"
logo = "assets/favicon.svg"
features = [
    "content.action.view",
    "content.action.edit",
    "content.code.copy",
    "content.code.select",
    "content.tabs.link",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "toc.follow",
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# Light/dark palette toggle. `media` lets the browser pick based on
# `prefers-color-scheme`; the toggle in the header lets users override.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "black"
accent = "amber"
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "amber"
toggle = { icon = "material/weather-sunny", name = "Switch to light mode" }
